[package]
name = "moon-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screencast"] }
bytes = "1.12.1"
clap = { version = "4.6.8", features = ["derive"] }
evdev = "0.13.2"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
libloading = "0.9.1"
mdns-sd = "0.22.0"
moon-media = { version = "0.1.0", path = "../moon-media" }
moon-proto = { version = "0.1.0", path = "../moon-proto" }
rand = "0.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusty_enet = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
