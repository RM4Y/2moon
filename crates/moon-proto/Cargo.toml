[package]
name = "moon-proto"
version = "0.5.0"
edition = "2021"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
der = "0.7"
hex = "0.4"
rand = "0.8"
roxmltree = "0.21.2"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
spki = "0.7"
thiserror = "2"
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }
