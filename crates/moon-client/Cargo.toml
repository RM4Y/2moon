[package]
name = "moon-client"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.8", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
hex = "0.4.3"
libloading = "0.9.1"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mdns-sd = "0.22.0"
moon-media = { version = "0.3.0", path = "../moon-media" }
moon-proto = { version = "0.3.0", path = "../moon-proto" }
rand = "0.8"
rayon = "1.12.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusty_enet = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
softbuffer = "0.4.8"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
winit = "0.30.13"
