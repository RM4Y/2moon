[package]
name = "moon-media"
version = "0.5.3"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
libloading = "0.9.1"
openh264 = "0.9.10"
rayon = "1.12.0"
tracing = "0.1.44"

[dev-dependencies]
